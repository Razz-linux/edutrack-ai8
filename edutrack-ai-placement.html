<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>EduTrack AI</title>
<style>
:root{--bg:#f4f6fb;--c:#fff;--t:#1e2340;--m:#6b7194;--b:#e3e6f2;--p:#4f46e5;--p2:#7c3aed;--g:#16a34a;--y:#d97706;--r:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1224;--c:#1a1e38;--t:#e8eaf8;--m:#9aa0c4;--b:#2a2f52}}
:root[data-theme=dark]{--bg:#0f1224;--c:#1a1e38;--t:#e8eaf8;--m:#9aa0c4;--b:#2a2f52}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--t);font:14px/1.5 Inter,system-ui,Segoe UI,sans-serif}
h1,h2,h3{margin:0 0 8px}h2{font-size:22px}h3{font-size:16px}p{margin:4px 0}.m{color:var(--m)}
.grad{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.btn{border:0;border-radius:8px;padding:9px 16px;font:600 14px inherit;cursor:pointer;background:var(--p);color:#fff}.btn.o{background:transparent;color:var(--p);border:1px solid var(--p)}.btn.w{background:#fff;color:var(--p)}.btn.s{padding:5px 10px;font-size:12px}
.app{display:flex;min-height:100vh}.side{width:220px;background:var(--c);border-right:1px solid var(--b);padding:14px 10px;flex:none}
.side a{display:block;padding:8px 12px;border-radius:8px;color:var(--m);cursor:pointer;margin-bottom:2px}.side a.on,.side a:hover{background:rgba(79,70,229,.12);color:var(--p);font-weight:600}
.main{flex:1;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--c);border-bottom:1px solid var(--b)}.pg{padding:20px;max-width:1100px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:14px}.grid .card{margin:0}
.big{font-size:28px;font-weight:700}.tbl{width:100%;border-collapse:collapse}.tw{overflow-x:auto}
.tbl th,.tbl td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--b);white-space:nowrap}.tbl th{color:var(--m);font-size:12px;text-transform:uppercase}.tbl tr.k{cursor:pointer}.tbl tr.k:hover{background:rgba(79,70,229,.07)}
.bar{height:8px;background:var(--b);border-radius:6px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%}
.tag{padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600;display:inline-block}.tag.L{background:#dcfce7;color:#166534}.tag.M{background:#fef3c7;color:#92400e}.tag.H{background:#fee2e2;color:#991b1b}
.note{background:rgba(79,70,229,.1);border-left:3px solid var(--p);padding:8px 12px;border-radius:6px;font-size:13px;margin:8px 0}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.steps span{padding:6px 12px;border-radius:20px;background:var(--b);font-size:12px}.steps span.on{background:var(--p);color:#fff}
input,select{padding:8px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font:inherit;max-width:100%}input[type=range]{width:100%}
.hero{padding:60px 20px;text-align:center}.hero h1{font-size:44px}.hero p{max-width:640px;margin:10px auto}
.fc{padding:18px;text-align:center}.fc b{display:block;font-size:26px}.login{max-width:360px;margin:60px auto}.login input{width:100%;margin-bottom:10px}
.flow{text-align:center}.flow div{display:inline-block;padding:10px 18px;border-radius:10px;border:1px solid var(--b);background:var(--c);margin:2px;font-weight:600}.flow div.h{background:var(--p);color:#fff}.flow .ar{border:0;background:none;color:var(--p);display:block;padding:0}
.toast{position:fixed;bottom:20px;right:20px;background:var(--t);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:9}
.menu{display:none}
@media(max-width:800px){.side{position:fixed;left:-230px;top:0;bottom:0;z-index:5;transition:.2s}.side.open{left:0}.menu{display:inline-block}.hero h1{font-size:32px}}
.nh{padding:12px 12px 4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--m)}
.bd{padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600;display:inline-block}.bd.V{background:#dcfce7;color:#166534}.bd.P{background:#fef3c7;color:#92400e}.bd.R{background:#fee2e2;color:#991b1b}.bd.U{background:var(--b);color:var(--m)}
.ch{display:inline-block;padding:2px 9px;margin:2px 0;border-radius:12px;font-size:12px;background:var(--b);color:var(--t)}.ch.m{background:rgba(79,70,229,.15);color:var(--p);font-weight:600}
.fg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.fg label{display:block;font-size:12px;color:var(--m);font-weight:600}.fg input,.fg select,.fg textarea{width:100%;margin-top:3px}
textarea{padding:8px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font:inherit;max-width:100%}
.mo{position:fixed;inset:0;background:rgba(10,12,30,.55);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}.mbox{background:var(--c);color:var(--t);border-radius:12px;padding:20px;max-width:900px;width:100%;border:1px solid var(--b)}
.res{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--b)}.pv{border:2px dashed var(--b);border-radius:10px;padding:40px;text-align:center;color:var(--m)}
.btn:disabled{opacity:.4;cursor:not-allowed}
@media print{body.pr #root,body.pr #tt{display:none!important}body.pr .mo{position:static;background:none;padding:0}body.pr .mbox{border:0;max-width:none}.np{display:none!important}}
</style></head><body><div id="root"></div><div id="tt"></div>
<script>
const $=id=>document.getElementById(id);
const SUB=['Data Structures','DBMS','Computer Networks','Operating Systems','Cloud Computing'];
const ATT=[[40,35],[38,29],[42,29],[36,31],[34,27]],MST=[[24,26],[18,23],[20,21],[25,27],[22,25]],ASG=[[80,86],[74,82],[78,80],[85,88],[82,90]];
const ST=['Completed','In Progress','Not Started'];
let SYL=SUB.map((s,i)=>[0,1,2,3,4].map(u=>i==0?(u<3?0:u==3?1:2):(u<2+(i%3)?0:u==2+(i%3)?1:2)));
let LEC=[{t:'B-Trees and Indexing',s:'DBMS',d:'2025-01-08',u:3,done:1,m:'btree-notes.pdf'},{t:'Normal Forms (1NF-BCNF)',s:'DBMS',d:'2025-01-10',u:3,done:1,m:'normalization.pdf'},{t:'Transaction ACID Properties',s:'DBMS',d:'2025-01-17',u:4,done:0,m:'transactions-slides.pdf'},{t:'Graph Traversals',s:'Data Structures',d:'2025-01-15',u:4,done:0,m:'graphs.pdf'},{t:'TCP Congestion Control',s:'Computer Networks',d:'2025-01-12',u:3,done:1,m:'tcp-notes.pdf'}];
let ASGL=[{t:'ER Diagram Design',s:'DBMS',dl:'2025-01-20'}];
const STU=[
{n:'Raj',a:78,m:74,s:82,r:'L',t:'↗',w:['Strong overall consistency']},
{n:'Aman',a:64,m:48,s:55,r:'H',t:'↘',w:['Attendance below 75%','MST performance declining','DBMS learning gap','Assignment performance declining']},
{n:'Priya',a:91,m:88,s:92,r:'L',t:'↗',w:[]},
{n:'Riya',a:69,m:65,s:71,r:'M',t:'→',w:['Attendance below 75%','Computer Networks learning gap']},
{n:'Karan',a:72,m:61,s:66,r:'M',t:'↘',w:['Attendance borderline','Assignment dip in OS']},
{n:'Sneha',a:85,m:79,s:84,r:'L',t:'↗',w:[]}];
const IVS=['Not Started','In Progress','Follow-up','Resolved'];
const GAPS=[['ER Model',85],['SQL',78],['Normalization',42],['Transactions',38],['Indexing',65]];
const PLAN=[['Revise DBMS Normalization','30 minutes'],['Practice 10 Normalization questions','45 minutes'],['Study Transactions (ACID, schedules)','40 minutes'],['Take a DBMS mini assessment','20 minutes'],['Review incorrect answers','30 minutes']];
let S={role:null,login:null,page:'',sel:null,iv:{Aman:0,Riya:0,Karan:0},done:[],open:0,att:{}};
const col=p=>p>=75?'var(--g)':p>=65?'var(--y)':'var(--r)';
const bar=p=>`<div class="bar"><i style="width:${p}%;background:${col(p)}"></i></div>`;
const tag=r=>`<span class="tag ${r}">${{L:'🟢 LOW',M:'🟡 MEDIUM',H:'🔴 HIGH'}[r]}</span>`;
const stat=(l,v,s='')=>`<div class="card"><div class="m">${l}</div><div class="big">${v}</div>${s}</div>`;
const tbl=(h,rows,k)=>`<div class="tw"><table class="tbl"><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table></div>`;
const card=(t,b)=>`<div class="card"><h3>${t}</h3>${b}</div>`;
const demo=`<div class="note">🤖 Demo AI Analysis – simulated for prototype</div>`;
const sim=`<div class="note">Simulation only – actual performance may vary.</div>`;
const avg=a=>Math.round(a.reduce((x,y)=>x+y,0)/a.length);
const perf=()=>76+Math.round(S.done.length*.8);
function toast(m){$('tt').innerHTML=`<div class="toast">${m}</div>`;setTimeout(()=>$('tt').innerHTML='',2200)}
function line(v,l,c='#4f46e5'){const w=480,h=170,mn=Math.min(...v)-8,mx=Math.max(...v)+6,x=i=>30+i*(w-60)/(v.length-1),y=n=>h-25-(n-mn)/(mx-mn)*(h-50);
return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:560px"><polyline fill="none" stroke="${c}" stroke-width="3" points="${v.map((n,i)=>x(i)+','+y(n)).join(' ')}"/>${v.map((n,i)=>`<circle cx="${x(i)}" cy="${y(n)}" r="5" fill="${c}"/><text x="${x(i)}" y="${y(n)-10}" text-anchor="middle" font-size="12" fill="currentColor">${n}%</text><text x="${x(i)}" y="${h-5}" text-anchor="middle" font-size="11" fill="#8a90b0">${l[i]}</text>`).join('')}</svg>`}
const bars=(items)=>items.map(([l,v])=>`<div style="display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;margin:7px 0"><span>${l}</span>${bar(v)}<b>${v}%</b></div>`).join('');
const trend=()=>{const v=[62,67,71,76],l=['Jan','Feb','Mar','Apr'];if(S.done.length>=3){v.push(perf());l.push('May*')}return line(v,l)};
const gapList=()=>bars(GAPS)+`<p><b>Primary Learning Gap:</b> Normalization &nbsp; <b>Secondary:</b> Transactions</p><p class="m">Your performance indicates that additional practice may be helpful in these topics.</p>`;
const attRow=i=>{const [t,a]=ATT[i],p=+(a/t*100).toFixed(1);return `<tr><td>${SUB[i]}</td><td>${t}</td><td>${a}</td><td>${t-a}</td><td>${p}%</td><td>${bar(p)}</td></tr>`};
const need=(a,t,g=.75)=>Math.max(0,Math.ceil((g*t-a)/(1-g)));

const NAVS={student:[['dash','Dashboard'],['att','Attendance'],['mst','MST Marks'],['asg','Assignments'],['lec','Lectures'],['syl','Syllabus'],['perf','Performance'],['ai','AI Insights'],['plan','Action Plan'],['whatif','What-If Simulator'],['prof','Profile'],['flow','From Data to Action']],
faculty:[['dash','Dashboard'],['stu','Students'],['att','Attendance'],['mst','MST Marks'],['asg','Assignments'],['lec','Lectures'],['syl','Syllabus'],['an','AI Analytics'],['risk','Risk Detection'],['iv','Interventions'],['prof','Profile'],['flow','From Data to Action']]};

function ivPanel(n){const u=STU.find(x=>x.n==n),i=S.iv[n]??0;
return card(`${n} – ${u.r=='H'?'Academic Intervention Required':'Student Overview'}`,`<p>${tag(u.r)} Attendance ${u.a}% · MST ${u.m}% · Assignments ${u.s}% · Trend ${u.t}</p>
${u.r!='L'?demo+`<p><b>Risk Reasons</b></p>${u.w.map(w=>`<p>⚠ ${w}</p>`).join('')}<p class="m">Potential academic risk detected. This is a decision-support signal, not a prediction of failure.</p>
<p><b>Recommended Intervention</b></p><ol><li>Contact student</li><li>Discuss attendance</li><li>Assign DBMS revision material</li><li>Give additional practice questions</li><li>Schedule follow-up assessment</li></ol>
<div class="steps">${IVS.map((s,j)=>`<span class="${j<=i?'on':''}">${s}</span>`).join('→')}</div>
<button class="btn" onclick="setIv('${n}',1)">Start Intervention</button> <button class="btn o" onclick="setIv('${n}',2)">Schedule Follow-up</button> <button class="btn o" onclick="setIv('${n}',3)">Mark as Resolved</button>`:`<p>No intervention needed. ${u.w[0]||'Healthy performance across all indicators.'}</p>`}`)}
function setIv(n,i){S.iv[n]=i;toast(`${n}: ${IVS[i]}`);go(S.page,S.sel)}

const P={student:{
dash:()=>`<h2>Welcome, Raj</h2><p class="m">Semester V · Section CSE(CY)</p><div class="grid">${stat('Overall Attendance','78%',bar(78))}${stat('Average MST','74%',bar(74))}${stat('Assignment Score','82%',bar(82))}${stat('Syllabus Completion','68%',bar(68))}${stat('Overall Performance',perf()+'%',bar(perf()))}</div><br>${card('Academic Health',`<div class="grid"><div><div class="m">Status</div><b>🟢 GOOD</b></div><div><div class="m">Performance Trend</div><b>↗ Improving</b></div><div><div class="m">Attendance Risk</div><b>🟡 Medium</b></div><div><div class="m">Learning Risk</div><b>🟢 Low</b></div></div>${S.done.length?`<div class="note">Action plan progress (${S.done.length}/5 activities) has updated your performance projection.</div>`:''}`)}`,
att:()=>`<h2>Subject-wise Attendance</h2>${card('Overall Attendance: 78%',tbl(['Subject','Total Classes','Attended','Absent','Attendance',''],SUB.map((_,i)=>attRow(i)))+`<p class="m">🟢 ≥75% Good · 🟡 65–75% Warning · 🔴 &lt;65% Critical</p>`)}${card('Attendance Risk',`<h3 style="color:var(--r)">Computer Networks – 69%</h3><p>⚠ Attendance Risk Detected</p><p>Attendance is below the recommended threshold.</p><p>Current attendance: <b>69%</b> · Target: <b>75%</b></p><p>Estimated classes required to reach target (attending all): <b>${need(29,42)}</b></p>`)}`,
mst:()=>`<h2>MST Marks</h2>${card('Average performance: 74%',tbl(['Subject','MST 1','MST 2','Average','Trend'],SUB.map((s,i)=>{const[a,b]=MST[i];return `<tr><td>${s}</td><td>${a}/30</td><td>${b}/30</td><td>${Math.round((a+b)/60*100)}%</td><td>${b>a?'↗':'→'}</td></tr>`})))}${card('MST comparison',bars(SUB.map((s,i)=>[s,Math.round((MST[i][0]+MST[i][1])/60*100)])))}`,
asg:()=>`<h2>Assignments</h2>${card('Overall Assignment Performance: 82%',tbl(['Subject','Assignment 1','Assignment 2','Average','Status'],SUB.map((s,i)=>{const[a,b]=ASG[i],m=avg([a,b]);return `<tr><td>${s}</td><td>${a}%</td><td>${b}%</td><td>${m}%</td><td>${m>=80?'🟢 Excellent':'🟡 Good'}</td></tr>`})))}${ASGL.map(a=>card('New: '+a.t,`<p>${a.s} · Deadline ${a.dl}</p>`)).join('')}`,
lec:()=>`<h2>Lectures & Study Material</h2><div class="grid g2">${card('✅ Completed Lectures',LEC.filter(l=>l.done).map(l=>`<p><b>${l.t}</b><br><span class="m">${l.s} · Unit ${l.u} · ${l.d}</span></p>`).join(''))}${card('📅 Upcoming Lectures',LEC.filter(l=>!l.done).map(l=>`<p><b>${l.t}</b><br><span class="m">${l.s} · Unit ${l.u} · ${l.d}</span></p>`).join(''))}</div>${card('📚 Study Material',LEC.map(l=>`<p>📄 ${l.m} <span class="m">– ${l.s}</span></p>`).join(''))}`,
syl:()=>`<h2>Syllabus Tracking</h2>${stat('Syllabus Completion','68%',bar(68))}<br><div class="grid">${SUB.map((s,i)=>card(s,SYL[i].map((x,u)=>`<p>Unit ${u+1} ${['✓ Completed','⏳ In Progress','○ Not Started'][x]}</p>`).join(''))).join('')}</div>`,
perf:()=>`<h2>Student Academic Profile</h2><div class="grid">${stat('Academic Performance',perf()+'/100')}${stat('Attendance Health','78%')}${stat('Learning Progress','81%')}${stat('Consistency','73%')}${stat('Risk Level',tag('L'))}</div><br>${card('Performance Trend ↗',trend()+(S.done.length>=3?'<p class="m">*Updated after action-plan activities (simulated).</p>':''))}`,
ai:()=>`<h2>AI Academic Insights</h2>${demo}${card('Inputs analysed','<p>Attendance + MST + Assignments + Syllabus progress + Recent performance</p>')}<div class="grid">${stat('Academic Risk',tag('L'))}${stat('Performance Trend','↗ Improving')}${stat('Weak Subjects','Computer Networks, DBMS')}${stat('Strong Subjects','Data Structures, OS')}</div><br>${card('Learning Gap Analysis – DBMS',gapList())}${card('Early Academic Warning System',`<p><b>Raj</b> – Attendance 78%, MST 74%, Assignments 82% → ${tag('L')}</p><p><b>Aman</b> – Attendance 64%, MST 48%, Assignments 55% → ${tag('H')}</p><p class="m">Low attendance combined with declining MST and assignment performance indicates possible academic risk. Potential academic risk detected – not a guarantee of outcome.</p>`)}${card('Recommended Actions','<p>1. Attend upcoming Computer Networks classes</p><p>2. Follow the 5-day DBMS action plan</p><p>3. Maintain assignment consistency</p>')}`,
plan:()=>`<h2>Your Personalized Action Plan</h2>${demo}<p>Generated from simulated AI analysis (primary gap: DBMS Normalization). Progress: ${S.done.length}/5</p>${bar(S.done.length*20)}<br>${PLAN.map((p,i)=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><b>DAY ${i+1}</b><br>${p[0]}<br><span class="m">${p[1]}</span></div>${S.done.includes(i)?'<b style="color:var(--g)">✓ Done</b>':`<button class="btn" onclick="S.done.push(${i});toast('Activity completed');go('plan')">Start Activity</button>`}</div>`).join('')}${S.done.length==5?`<div class="note">🎉 Plan complete. Projected performance updated to ${perf()}% (see Performance page).</div>`:''}`,
whatif:()=>`<h2>What-If Simulator</h2><div class="grid g2">${card('Attendance – Computer Networks',`<p>Current: 29/42 = <b>69%</b></p><p>If I attend the next <b id="n1">10</b> classes:</p><input type="range" min="0" max="20" value="10" oninput="wi()" id="r1"><p id="o1"></p>`)}${card('MST Average',`<p>Current MST average: <b>62%</b> · Current projected performance: <b>68%</b></p><p>If I score <b id="n2">26</b>/30 in the next MST:</p><input type="range" min="0" max="30" value="26" oninput="wi()" id="r2"><p id="o2"></p>`)}</div>${sim}`,
prof:()=>card('Profile','<p><b>Raj Sharma</b> · Enrolment: DEMO-2023-042</p><p>Semester V · CSE(CY) · student@demo.com</p>')},
faculty:{
dash:()=>{const att=STU.filter(u=>u.r!='L');return `<h2>Faculty Dashboard</h2><div class="grid">${stat('Total Students','60')}${stat('Average Attendance','76%')}${stat('Average MST','72%')}${stat('Average Assignment','78%')}</div><br><div class="grid">${stat('🔴 High Risk','5')}${stat('🟡 Medium Risk','12')}${stat('🟢 Low Risk','43')}</div><br>${card('Students Requiring Attention',tbl(['Student','Risk','Reasons','Intervention'],att.map(u=>`<tr class="k" onclick="go('stu','${u.n}')"><td>${u.n}</td><td>${tag(u.r)}</td><td>${u.w[0]}</td><td>${IVS[S.iv[u.n]]}</td></tr>`)))}`},
stu:()=>S.sel?`<button class="btn o s" onclick="go('stu')">← All students</button><br><br>${ivPanel(S.sel)}`:`<h2>Student Analytics</h2>${card('Click a student to open details',tbl(['Student','Attendance','MST','Assignment','Risk','Trend'],STU.map(u=>`<tr class="k" onclick="go('stu','${u.n}')"><td>${u.n}</td><td>${u.a}%</td><td>${u.m}%</td><td>${u.s}%</td><td>${tag(u.r)}</td><td>${u.t}</td></tr>`)))}`,
att:()=>`<h2>Attendance Management</h2>${card('Mark attendance',`<select id="as">${SUB.map(s=>`<option>${s}</option>`)}</select> <input type="date" id="ad" value="2025-01-14"><br><br>${STU.map(u=>`<label style="display:block;padding:4px 0"><input type="checkbox" checked id="ab${u.n}"> ${u.n} <span class="m">(present)</span></label>`).join('')}<br><button class="btn" onclick="toast('Attendance saved – student data & AI analysis refreshed')">Save Attendance</button>`)}`,
mst:()=>`<h2>MST Management</h2>${card('Enter marks',`<select>${SUB.map(s=>`<option>${s}</option>`)}</select> <select><option>MST 1</option><option>MST 2</option></select><br><br>${STU.map(u=>`<p><input type="number" min="0" max="30" value="${Math.round(u.m*.3)}" style="width:70px"> /30 &nbsp; ${u.n}</p>`).join('')}<button class="btn" onclick="toast('Marks saved – risk analysis updated')">Save Marks</button>`)}`,
asg:()=>`<h2>Assignment Management</h2>${card('Create assignment',`<input id="at" placeholder="Title"> <select id="asu">${SUB.map(s=>`<option>${s}</option>`)}</select> <input type="date" id="adl"> <input type="file"><br><br><button class="btn" onclick="addA()">Create</button>`)}${card('Assignments',ASGL.map(a=>`<p>${a.t} · ${a.s} · due ${a.dl}</p>`).join(''))}${card('Submissions & marks',tbl(['Student','Status','Marks /100'],STU.map((u,i)=>`<tr><td>${u.n}</td><td>${i==1?'⚠ Late':'Submitted'}</td><td><input type="number" value="${u.s}" style="width:70px"></td></tr>`))+`<br><button class="btn" onclick="toast('Marks saved')">Save Marks</button>`)}`,

const vm=s=>s.interns.filter(i=>i.status=='Verified').reduce((a,i)=>a+i.months,0);
const pm=s=>s.interns.filter(i=>i.status=='Pending').reduce((a,i)=>a+i.months,0);

const hasSk=(s,k)=>s.skills.some(x=>x.toLowerCase()==k.toLowerCase());

const CL={cgpa:'Minimum CGPA',att:'Minimum attendance',back:'Active backlogs',skills:'Required technical skills',certs:'Verified relevant certificates',intern:'Internship experience',branch:'Branch',sem:'Semester'};

function evalS(d,s){const o=[],c=d.crit;const add=(k,res,msg)=>o.push({k,label:CL[k],res,msg,mand:!!c[k].mand});
if(c.cgpa.on)s.cgpa==null?add('cgpa','unv','CGPA is not available in the academic record yet'):s.cgpa>=c.cgpa.val?add('cgpa','pass',`CGPA ${s.cgpa} meets the minimum of ${c.cgpa.val}`):add('cgpa','fail',`CGPA ${s.cgpa} is below the minimum of ${c.cgpa.val}`);
if(c.att.on)s.att==null?add('att','unv','Attendance not available'):s.att>=c.att.val?add('att','pass',`Attendance ${s.att}% meets the minimum of ${c.att.val}%`):add('att','fail',`Attendance ${s.att}% is below the minimum of ${c.att.val}%`);
if(c.back.on)s.back==null?add('back','unv','Backlog record not available'):s.back<=c.back.val?add('back','pass',`${s.back} active backlog(s) — within the limit of ${c.back.val}`):add('back','fail',`${s.back} active backlog(s) exceeds the limit of ${c.back.val}`);
if(c.skills.on&&c.skills.val.length){const miss=c.skills.val.filter(k=>!hasSk(s,k));if(!s.skills.length)add('skills','unv','No skills declared in the portfolio yet');else miss.length?add('skills','fail',`Missing required skill(s): ${miss.join(', ')}`):add('skills','pass',`Has all required skills: ${c.skills.val.join(', ')} (self-declared, not document-verified)`)}
if(c.certs.on&&c.certs.val>0){const r=relC(s,c.certs.kw||[]),v=r.filter(x=>x.status=='Verified').length,p=r.filter(x=>x.status=='Pending').length,n=c.certs.val;
v>=n?add('certs','pass',`${v} verified relevant certificate(s) (need ${n})`):v+p>=n?add('certs','unv',`${v} verified + ${p} pending verification (need ${n} verified) — pending certificates are not counted`):add('certs','fail',`Only ${v} verified and ${p} pending relevant certificate(s) (need ${n})`)}
if(c.intern.on&&c.intern.val>0){const v=vm(s),p=pm(s),n=c.intern.val;v>=n?add('intern','pass',`${v} month(s) of verified internship (need ${n})`):v+p>=n?add('intern','unv',`${v} verified month(s) + ${p} month(s) awaiting verification or documents (need ${n})`):add('intern','fail',`${v} verified month(s) of internship (need ${n})`)}
if(c.branch.on&&c.branch.val.length)c.branch.val.includes(s.br)?add('branch','pass',`Branch ${s.br} is eligible`):add('branch','fail',`Branch ${s.br} is not in the eligible list (${c.branch.val.join(', ')})`);
if(c.sem.on&&c.sem.val.length)c.sem.val.includes(s.sem)?add('sem','pass',`Semester ${s.sem} is eligible`):add('sem','fail',`Semester ${s.sem} is not in the eligible list (${c.sem.val.join(', ')})`);
const m=o.filter(x=>x.mand);return{status:m.some(x=>x.res=='fail')?'Not Eligible':m.some(x=>x.res=='unv')?'Needs Review':'Eligible',checks:o}}

function printM(){document.body.classList.add('pr');window.print();setTimeout(()=>document.body.classList.remove('pr'),600)}
const getItem=(sid,t,i)=>PS.find(x=>x.id==sid)[t][i];
function pvDoc(sid,t,i){const s=PS.find(x=>x.id==sid),it=s[t][i],dc=it.doc,fac=S.role=='faculty';
const body=dc.url?(dc.type=='image'?`<img src="${dc.url}" alt="Uploaded file" style="max-width:100%;max-height:60vh;display:block;margin:auto">`:`<iframe src="${dc.url}" style="width:100%;height:60vh;border:0"></iframe>`):`<div class="pv">📄<br><b>${esc(dc.name)}</b><br>Simulated file preview — this prototype stores no real document for this entry.</div>`;
showM(`<div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(t=='certs'?it.name:it.company+' – completion certificate')}</h3><button class="btn o s" onclick="closeM()">Close</button></div><p class="m">${esc(s.name)} · ${esc(dc.name)} · ${BD(it.status)}</p>${it.status!='Verified'?'<div class="note">This document is <b>uploaded but not verified</b>. It is not counted in any eligibility check.</div>':'<div class="note">Marked Verified by faculty (manual review, simulated).</div>'}${body}${fac?`<br><input id="rm_${sid}${t}${i}" placeholder="Remark (optional)" value="${esc(it.remark)}" style="width:100%;margin-bottom:8px"><button class="btn" onclick="setVer('${sid}','${t}',${i},'Verified')">Mark Verified</button> <button class="btn o" onclick="setVer('${sid}','${t}',${i},'Rejected')">Reject</button> <button class="btn o" onclick="setVer('${sid}','${t}',${i},'Pending')">Reset to Pending</button>`:''}`)}
function setVer(sid,t,i,st){const it=getItem(sid,t,i),r=$(`rm_${sid}${t}${i}`);if(r)it.remark=r.value.trim();else if(st=='Rejected'&&!it.remark)it.remark='Document could not be confirmed (simulated remark)';it.status=st;touch();closeM();toast(`Marked ${st} — re-run the Eligibility Generator to refresh lists`);draw()}

/* ---------- portfolio ---------- */
const docRow=(t,i,it,s,fac)=>{if(!it.doc)return `<span class="bd U">No document uploaded</span> <span class="m" style="font-size:12px">self-reported · not verified</span>`;return `${BD(it.status)} <button class="btn o s" onclick="pvDoc('${s.id}','${t}',${i})">Preview file</button>${fac&&it.status=='Pending'?` <button class="btn s" onclick="setVer('${s.id}','${t}',${i},'Verified')">Verify</button> <button class="btn o s" onclick="setVer('${s.id}','${t}',${i},'Rejected')">Reject</button>`:''}${fac&&it.status!='Pending'?` <button class="btn o s" onclick="setVer('${s.id}','${t}',${i},'Pending')">Reset</button>`:''}${it.remark?`<div class="m" style="font-size:12px">Faculty remark: ${esc(it.remark)}</div>`:''}`};
function pfView(s,fac){const sec=(t,b)=>`<div class="card"><h3>${t}</h3>${b||'<p class="m">Nothing added yet.</p>'}</div>`;
return `<div class="card grad" style="padding:20px"><h2 style="margin:0">${esc(s.name)}</h2><p>${esc(s.enr)} · ${s.br} · Semester ${s.sem}</p><p>CGPA ${s.cgpa??'—'} · Attendance ${s.att}% · Active backlogs ${s.back}</p><p style="opacity:.85;font-size:12px">Academic figures come from faculty-maintained records and cannot be edited here.</p></div>
${sec('Technical Skills',s.skills.length?s.skills.map(x=>`<span class="ch">${esc(x)}</span>`).join(' ')+'<p class="m" style="font-size:12px">Self-declared; not document-verified.</p>':'')}
${sec('Certificates',s.certs.map((c,i)=>`<div class="res"><div style="flex:1"><b>${esc(c.name)}</b><br><span class="m">${esc(c.org)} · ${esc(c.cat)} · Issued ${esc(c.date)}${safeUrl(c.url)?` · <a href="${esc(c.url)}" target="_blank" rel="noopener">Credential link</a>`:''}</span><br>${docRow('certs',i,c,s,fac)}</div></div>`).join(''))}
${sec('Internship Experience',s.interns.map((c,i)=>`<div class="res"><div style="flex:1"><b>${esc(c.role)}</b> · ${esc(c.company)}<br><span class="m">${c.months} month(s) · Skills: ${esc(c.skills)}</span><p>${esc(c.desc)}</p>${docRow('interns',i,c,s,fac)}</div></div>`).join(''))}
${sec('Projects',s.projects.map(p=>`<div class="res"><div><b>${esc(p.title)}</b> <span class="m">· ${esc(p.tech)}</span><p>${esc(p.desc)}</p>${safeUrl(p.link)?`<a href="${esc(p.link)}" target="_blank" rel="noopener">Project link</a>`:''}</div></div>`).join(''))}
${sec('Achievements',s.ach.map(p=>`<div class="res"><div><b>${esc(p.title)}</b> <span class="m">${esc(p.date)}</span><p>${esc(p.desc)}</p></div></div>`).join(''))}`}
const FLD={certs:[['name','Certificate name','text',1],['org','Issuing organization','text',1],['date','Issue date','date',1],['cat','Category','select'],['url','Credential URL','url'],['file','Certificate file (PDF or image)','file']],
interns:[['company','Company name','text',1],['role','Role','text',1],['months','Duration (months)','number',1],['skills','Skills learned (comma separated)','text'],['desc','Description','textarea'],['file','Internship completion certificate (PDF or image)','file']],
projects:[['title','Project title','text',1],['tech','Technologies used','text'],['link','Project link','url'],['desc','Description','textarea']],
ach:[['title','Achievement','text',1],['date','Date','date'],['desc','Details','textarea']]};
function formHtml(t,it){return `<div class="fg">${FLD[t].map(([k,l,ty,req])=>{const id=`f_${t}_${k}`,v=it?it[k]:'';const lab=`<label>${l}${req?' *':''}`;
if(ty=='select')return `${lab}<select id="${id}">${CATS.map(c=>`<option ${v==c?'selected':''}>${c}</option>`).join('')}</select></label>`;
if(ty=='textarea')return `${lab}<textarea id="${id}" rows="2">${esc(v)}</textarea></label>`;
if(ty=='file')return `${lab}<input type="file" id="${id}" accept=".pdf,image/*">${it&&it.doc?`<span class="m" style="font-weight:400">Current: ${esc(it.doc.name)} (choose a file to replace)</span>`:'<span class="m" style="font-weight:400">Optional in this demo — if skipped, a simulated sample file is attached</span>'}</label>`;
return `${lab}<input id="${id}" type="${ty}" value="${esc(v)}"></label>`}).join('')}</div>`}
function pfSave(t){const f={};let ok=true;FLD[t].forEach(([k,l,ty,req])=>{if(ty=='file')return;f[k]=$(`f_${t}_${k}`).value.trim();if(req&&!f[k])ok=false});if(!ok)return toast('Please fill all required (*) fields');
const e=PL.edit&&PL.edit.t==t?PL.edit.i:null,arr=ME[t],it=e!=null?arr[e]:{};Object.assign(it,f);if(t=='interns')it.months=Math.max(0,+f.months||0);
if(t=='certs'||t=='interns'){const fi=$(`f_${t}_file`),file=fi&&fi.files[0];
if(file){it.doc={name:file.name,type:file.type.startsWith('image')?'image':'pdf',url:URL.createObjectURL(file)};it.status='Pending';it.remark=''}
else if(e==null){it.doc=t=='certs'?{name:'sample-certificate.pdf',type:'pdf',url:null}:null;it.status='Pending';it.remark=''}
else if(it.status!='Pending'){it.status='Pending';it.remark='';toast('Details changed — re-verification required')}}
if(e==null)arr.push(it);PL.edit=null;touch();draw();toast(e==null?'Entry added':'Entry updated')}
function pfEdit(t,i){PL.view='manage';PL.edit={t,i};draw();const f=$('form_'+t);if(f)f.scrollIntoView({behavior:'smooth'})}
function pfDel(t,i){ME[t].splice(i,1);if(PL.edit)PL.edit=null;touch();draw();toast('Entry deleted')}
function addSkill(){const v=$('sk').value.split(',').map(x=>x.trim()).filter(x=>x&&!hasSk(ME,x));if(!v.length)return toast('Enter a new skill');ME.skills.push(...v);touch();draw()}
function rmSkill(i){ME.skills.splice(i,1);touch();draw()}
function pfManage(s){const L=(t,title,line)=>{const ed=PL.edit&&PL.edit.t==t;return `<div class="card" id="form_${t}"><h3>${title}</h3>${s[t].map((it,i)=>`<div class="res"><div style="flex:1">${line(it)}${t=='certs'||t=='interns'?`<br>${docRow(t,i,it,s,0)}`:''}</div><div><button class="btn o s" onclick="pfEdit('${t}',${i})">Edit</button> <button class="btn o s" onclick="pfDel('${t}',${i})">Delete</button></div></div>`).join('')||'<p class="m">No entries yet.</p>'}<h3 style="font-size:14px;margin-top:14px">${ed?'Edit entry':'Add new'}</h3>${formHtml(t,ed?s[t][PL.edit.i]:null)}<br><button class="btn" onclick="pfSave('${t}')">${ed?'Save changes':'Add'}</button>${ed?' <button class="btn o" onclick="PL.edit=null;draw()">Cancel</button>':''}</div>`};
return `<div class="card"><h3>Technical Skills</h3>${s.skills.map((x,i)=>`<span class="ch">${esc(x)} <a href="#" onclick="rmSkill(${i});return false" title="Remove">✕</a></span>`).join(' ')||'<p class="m">No skills yet.</p>'}<br><br><input id="sk" placeholder="e.g. Docker, Power BI"> <button class="btn s" onclick="addSkill()">Add skill</button></div>
${L('certs','Certificates',c=>`<b>${esc(c.name)}</b> <span class="m">· ${esc(c.org)} · ${esc(c.cat)} · ${esc(c.date)}</span>`)}${L('interns','Internships',c=>`<b>${esc(c.role)}</b> · ${esc(c.company)} <span class="m">· ${c.months} month(s)</span>`)}${L('projects','Projects',c=>`<b>${esc(c.title)}</b> <span class="m">· ${esc(c.tech)}</span>`)}${L('ach','Achievements',c=>`<b>${esc(c.title)}</b> <span class="m">· ${esc(c.date)}</span>`)}`}
P.student.pf=()=>{const s=ME;const all=[...s.certs,...s.interns.filter(i=>i.doc)];const n=x=>all.filter(i=>i.status==x).length;
return `<h2>My Career Portfolio</h2>${plNote}<div class="grid">${stat('Verified documents',n('Verified'),'<span class="bd V">✔ Counts toward eligibility</span>')}${stat('Uploaded, pending',n('Pending'),'<span class="bd P">⏳ Not counted yet</span>')}${stat('Rejected',n('Rejected'),'<span class="bd R">✖ Needs re-upload</span>')}</div><br>
<div class="note"><b>Uploaded ≠ Verified.</b> Only documents marked Verified by faculty are counted as credentials when eligibility is generated.</div>
<div class="card"><label><input type="checkbox" ${s.share?'checked':''} onchange="ME.share=this.checked;toast('Sharing preference saved')"> Allow faculty to share my <b>verified</b> career documents with recruiters (only for drives where I am shortlisted)</label></div>
<div class="steps"><span class="${PL.view=='view'?'on':''}" style="cursor:pointer" onclick="PL.view='view';PL.edit=null;draw()">Portfolio view</span><span class="${PL.view=='manage'?'on':''}" style="cursor:pointer" onclick="PL.view='manage';draw()">Manage entries</span></div>${PL.view=='view'?pfView(s,0):pfManage(s)}`};

/* ---------- student placement dashboard + readiness ---------- */
function applyDrive(id){const d=DR.find(x=>x.id==id);d.applied[ME.id]=1;touch();toast('Application submitted');draw()}
const stText=(d,s)=>d.stage[s.id]&&d.stage[s.id]!='Eligible'?`<b>${d.stage[s.id]}</b>`:d.stage[s.id]=='Eligible'?'<b>Eligibility confirmed by faculty</b>':d.applied[s.id]?'Applied — awaiting faculty review':'Not applied';
P.student.pd=()=>{const s=ME,ev=DR.map(d=>({d,r:evalS(d,s)}));const ul=(a,c)=>a.length?`<ul style="margin:4px 0;padding-left:18px">${a.map(x=>`<li>${esc(x.label)}${x.mand?'':' <span class="m">(preferred)</span>'}: ${esc(x.msg)}</li>`).join('')}</ul>`:'<p class="m">None</p>';
return `<h2>Placement Dashboard</h2>${plNote}<div class="grid">${stat('Available drives',DR.filter(d=>d.status=='Active').length)}${stat('Currently eligible',ev.filter(x=>x.r.status=='Eligible').length)}${stat('Awaiting verification',ev.filter(x=>x.r.status=='Needs Review').length)}${stat('Applications',DR.filter(d=>d.applied[s.id]).length)}</div><br>
<div class="note">Eligibility below is calculated live from <b>your own</b> records and verified documents. The official list is reviewed by faculty. You cannot see other students' data.</div>
${ev.map(({d,r})=>{const days=Math.ceil((new Date(d.deadline+'T23:59:59')-new Date())/864e5),open=d.status=='Active'&&days>=0;
return card(`${esc(d.company)} — ${esc(d.role)} ${EB(r.status)}`,`<p class="m">${esc(d.jd)}</p><p>Package: <b>${esc(d.pkg||'Not disclosed')}</b> · Deadline: <b>${d.deadline}</b> ${open?`(${days} day(s) left)`:'<span class="bd R">Closed</span>'}</p><div class="grid g2"><div><b>✔ Criteria you meet</b>${ul(r.checks.filter(x=>x.res=='pass'))}</div><div><b>✖ Criteria you do not meet</b>${ul(r.checks.filter(x=>x.res=='fail'))}</div></div><b>⏳ Awaiting verification / information</b>${ul(r.checks.filter(x=>x.res=='unv'))}<p>Status: ${stText(d,s)}</p>${!d.applied[s.id]&&open&&r.status!='Not Eligible'?`<button class="btn" onclick="applyDrive('${d.id}')">Apply</button>`:''}${r.status=='Needs Review'?` <button class="btn o" onclick="PL.view='manage';go('pf')">Go to my portfolio</button>`:''}`)}).join('')}`};
function readiness(s){const act=DR.filter(d=>d.status=='Active'),req=[...new Set(act.flatMap(d=>d.crit.skills.on?d.crit.skills.val:[]))],have=req.filter(k=>hasSk(s,k));
const parts=[['Academic (CGPA)',s.cgpa==null?0:Math.round(s.cgpa*10),.3],['Attendance',s.att,.15],['Skills vs. open drives',req.length?Math.round(have.length/req.length*100):100,.25],['Projects',Math.min(100,s.projects.length*50),.1],['Verified experience',Math.min(100,vc(s)*25+vm(s)*25),.2]];
const sg=[];act.forEach(d=>{evalS(d,s).checks.filter(x=>x.res!='pass').forEach(x=>{const w=d.company.split(' ')[0];
if(x.k=='cgpa'&&x.res=='fail')sg.push(['Improve CGPA — '+x.msg,w]);if(x.k=='att'&&x.res=='fail')sg.push(['Improve attendance — '+x.msg,w]);
if(x.k=='skills'&&x.res=='fail')sg.push(['Learn a required skill — '+x.msg,w]);
if(x.k=='certs')sg.push([x.res=='unv'?'Get your pending certificate verified — '+x.msg:'Obtain a relevant certification — '+x.msg,w]);
if(x.k=='intern')sg.push([x.res=='unv'?'Upload/verify your internship completion certificate — '+x.msg:'Gain internship experience — '+x.msg,w])})});
if(s.projects.length<3)sg.push(['Complete another relevant project using in-demand skills and add it to your portfolio','General']);
return{parts,score:Math.round(parts.reduce((a,p)=>a+p[1]*p[2],0)),sg}}
P.student.pr=()=>{const r=readiness(ME);return `<h2>Placement Readiness Insights</h2>${plNote}<div class="grid">${stat('Readiness score (indicative)',r.score+'/100',bar(r.score))}</div><div class="note"><b>Indicative only.</b> This is a simple rule-based score from your CGPA, attendance, skills, projects and verified experience. It is not an AI prediction and never overrides a company's mandatory criteria.</div>${card('Score breakdown',bars(r.parts.map(p=>[p[0],p[1]])))}${card('Suggested next steps',r.sg.length?r.sg.map(x=>`<p>➡ ${esc(x[0])} <span class="m">(${esc(x[1])})</span></p>`).join(''):'<p>You currently meet the checks for open drives. Keep your documents up to date.</p>')}`};

P.faculty.pdash=()=>{const act=DR.filter(d=>d.status=='Active');const steps=[['Student uploads a certificate and adds internship experience','Log out → Student Login → My Career Portfolio → Manage entries',''],['Faculty reviews the document and marks it Verified','','pvq'],['Faculty creates a company recruitment drive','','pnew'],['Faculty configures mandatory eligibility criteria','','pnew'],['System generates Eligible / Not Eligible / Needs Review lists','','pgen'],['Open a student\'s eligibility explanation','','pgen'],['Review and shortlist candidates','','pel'],['Export the final reviewed shortlist','','prep'],['Student views eligibility and application status','Log out → Student Login → Placement Dashboard','']];
return `<h2>Placement Dashboard</h2>${plNote}<div class="grid">${stat('Active drives',act.length)}${stat('Eligible students (across drives)',act.reduce((a,d)=>a+PS.filter(s=>d.results&&d.results[s.id].status=='Eligible').length,0))}${stat('Documents pending verification',pendCount())}${stat('Shortlisted candidates',DR.reduce((a,d)=>a+stg(d),0))}</div><br>
${card('Drives overview',tbl(['Company','Role','Deadline','Eligible','Needs Review','Not Eligible','List status'],DR.map(d=>{const c=k=>PS.filter(s=>d.results&&d.results[s.id].status==k).length;return `<tr class="k" onclick="PL.gd='${d.id}';go('pgen')"><td>${esc(d.company)}</td><td>${esc(d.role)}</td><td>${d.deadline}</td><td>${c('Eligible')}</td><td>${c('Needs Review')}</td><td>${c('Not Eligible')}</td><td>${d.results?(d.genRev==REV?'Up to date':'⚠ Regenerate'):'Not generated'}</td></tr>`})))}
${card('Demo walkthrough',`<ol>${steps.map(([t,h,p])=>`<li style="margin:6px 0">${t} ${p?`<button class="btn o s" onclick="go('${p}')">Open</button>`:`<span class="m">${h}</span>`}</li>`).join('')}</ol>`)}`};
P.faculty.pdr=()=>`<h2>Company Drives</h2>${plNote}${DR.map(d=>card(`${esc(d.company)} — ${esc(d.role)} <span class="bd ${d.status=='Active'?'V':'U'}">${d.status}</span>`,`<p>${esc(d.jd)}</p><p>Package: <b>${esc(d.pkg||'Not provided')}</b> · Deadline: <b>${d.deadline}</b> · Applicants: ${Object.keys(d.applied).length} · Shared with company: ${d.shared?'Yes':'No'}</p><p>${chips(d)}</p>${staleBanner(d)}<button class="btn" onclick="PL.gd='${d.id}';go('pgen')">Eligibility Generator</button> <button class="btn o" onclick="PL.f.drive='${d.id}';PL.f.status='';go('pel')">View students</button> <button class="btn o" onclick="DR.find(x=>x.id=='${d.id}').status='${d.status=='Active'?'Closed':'Active'}';draw()">${d.status=='Active'?'Close drive':'Reopen drive'}</button>`)).join('')}`;
const CR=[['cgpa','Minimum CGPA','number',7],['att','Minimum attendance %','number',75],['back','Max active backlogs','number',0],['skills','Required technical skills (comma separated)','text',''],['certs','Verified certificates needed','number',1],['intern','Internship needed (months)','number',1],['branch','Graduation branch','chk',BRS],['sem','Semester eligibility','chk',[1,2,3,4,5,6,7,8]]];
P.faculty.pnew=()=>`<h2>Create Recruitment Drive</h2>${plNote}<div class="card"><div class="fg"><label>Company name *<input id="n_co"></label><label>Job role *<input id="n_role"></label><label>Application deadline *<input type="date" id="n_dl" value="${dd(21)}"></label><label>Salary / package (optional)<input id="n_pkg" placeholder="e.g. ₹7 LPA"></label></div><label class="m" style="display:block;margin-top:10px">Job description<textarea id="n_jd" rows="3" style="width:100%"></textarea></label></div>

function createDrive(){const g=id=>$(id),co=g('n_co').value.trim(),role=g('n_role').value.trim();if(!co||!role||!g('n_dl').value)return toast('Company, role and deadline are required');const c=crit0();

/* ---------- explanation / generator ---------- */
const ICO={pass:'✔',fail:'✖',unv:'⏳'};
function expl(did,sid){const d=DR.find(x=>x.id==did),s=PS.find(x=>x.id==sid),r=d.results[sid];
showM(`<div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(s.name)} — ${esc(d.company)}</h3><button class="btn o s" onclick="closeM()">Close</button></div><p class="m">${esc(s.enr)} · ${s.br} · Sem ${s.sem} · CGPA ${s.cgpa??'—'} · Attendance ${s.att}% · Backlogs ${s.back}</p><p>Result: ${EB(r.status)}</p>
${r.checks.map(x=>`<div class="res"><div style="width:22px;color:${x.res=='pass'?'var(--g)':x.res=='fail'?(x.mand?'var(--r)':'var(--y)'):'var(--y)'}">${ICO[x.res]}</div><div><b>${esc(x.label)}</b> <span class="ch ${x.mand?'m':''}">${x.mand?'Mandatory':'Preferred'}</span><br>${esc(x.msg)}${!x.mand&&x.res!='pass'?'<br><span class="m">Preferred only — does not affect eligibility.</span>':''}</div></div>`).join('')||'<p class="m">No criteria configured.</p>'}
<p class="m" style="font-size:12px">Unverified certificates and internships are never counted as verified. Missing optional portfolio information never rejects a student on its own.</p><button class="btn o" onclick="closeM();go('pcp','${sid}')">Review documents</button> ${r.status=='Eligible'?`<button class="btn" onclick="setStage('${did}','${sid}','Shortlisted');closeM()">Shortlist</button>`:''}`)}
function doGen(id){const d=DR.find(x=>x.id==id);gen(d);toast('Eligible list generated');draw()}
P.faculty.pgen=()=>{const d=DR.find(x=>x.id==PL.gd)||DR[0],r=d.results,cnt=k=>r?PS.filter(s=>r[s.id].status==k).length:0;
const rows=r?PS.filter(s=>r[s.id].status==PL.gtab):[];
return `<h2>Eligibility Generator</h2>${plNote}<div class="card"><select onchange="PL.gd=this.value;draw()">${DR.map(x=>`<option value="${x.id}" ${x.id==d.id?'selected':''}>${esc(x.company)} – ${esc(x.role)}</option>`).join('')}</select><p style="margin-top:10px">${chips(d)}</p><p class="m">Deadline ${d.deadline} · Package ${esc(d.pkg||'—')}${d.genAt?' · Last generated '+esc(d.genAt):''}</p><button class="btn" onclick="doGen('${d.id}')">Generate Eligible List</button></div>${staleBanner(d)}
${r?`<div class="grid">${['Eligible','Needs Review','Not Eligible'].map(k=>`<div class="card" style="cursor:pointer;${PL.gtab==k?'border-color:var(--p)':''}" onclick="PL.gtab='${k}';draw()"><div class="m">${k}</div><div class="big">${cnt(k)}</div></div>`).join('')}</div><br>${card(PL.gtab+' students ('+rows.length+')',rows.length?`<div class="tw"><table class="tbl"><tr>${['Student','Branch / Sem','CGPA','Attendance','Backlogs','Relevant skills','Verified certs','Internship','Status',''].map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(s=>`<tr><td><b>${esc(s.name)}</b><br><span class="m">${esc(s.enr)}</span></td><td>${s.br} / ${s.sem}</td><td>${s.cgpa??'—'}</td><td>${s.att}%</td><td>${s.back}</td><td>${esc(relSk(d,s))}</td><td>${vc(s)}</td><td>${internTxt(s)}</td><td>${EB(r[s.id].status)}</td><td><button class="btn o s" onclick="expl('${d.id}','${s.id}')">Explanation</button></td></tr>`).join('')}</table></div>`:'<p class="m">No students in this category.</p>')}`:'<p class="m">Click <b>Generate Eligible List</b> to evaluate all students against these criteria.</p>'}`};

/* ---------- eligible students table ---------- */
const ACC={name:r=>r.s.name,company:r=>r.d.company,role:r=>r.d.role,br:r=>r.s.br+r.s.sem,cgpa:r=>r.s.cgpa??-1,att:r=>r.s.att,back:r=>r.s.back,skills:r=>relSk(r.d,r.s),verc:r=>vc(r.s),months:r=>vm(r.s),status:r=>r.x.status,stage:r=>r.stage,ap:r=>r.ap?1:0};
function elRows(){const f=PL.f;let r=[];DR.forEach(d=>{if(!d.results)return;PS.forEach(s=>r.push({d,s,x:d.results[s.id],stage:d.stage[s.id]||'',ap:!!d.applied[s.id]}))});
const q=f.q.toLowerCase();r=r.filter(o=>(!f.drive||o.d.id==f.drive)&&(!f.role||o.d.role.toLowerCase().includes(f.role.toLowerCase()))&&(!f.br||o.s.br==f.br)&&(!f.cgpa||(o.s.cgpa??0)>=+f.cgpa)&&(!f.att||o.s.att>=+f.att)&&(!f.skill||o.s.skills.join(' ').toLowerCase().includes(f.skill.toLowerCase()))&&(!f.intern||(f.intern=='yes')==(vm(o.s)>0))&&(!f.status||o.x.status==f.status)&&(!q||(o.s.name+o.s.enr+o.d.company+o.d.role).toLowerCase().includes(q)));
const a=ACC[PL.sort.k];r.sort((m,n)=>{const u=a(m),v=a(n);return(u>v?1:u<v?-1:0)*PL.sort.dir});return r}
const COLS=[['company','Company'],['role','Role'],['name','Student'],['br','Branch / Sem'],['cgpa','CGPA'],['att','Attendance'],['back','Backlogs'],['skills','Relevant skills'],['verc','Verified certs'],['months','Internship'],['status','Eligibility'],['stage','Faculty stage'],['ap','Applied'],['','Actions']];
function elTable(){const r=elRows(),so=PL.sort;return `<p class="m">Showing ${r.length} record(s)</p><div class="tw"><table class="tbl"><tr>${COLS.map(([k,l])=>`<th ${k?`style="cursor:pointer" onclick="srt('${k}')"`:''}>${l}${so.k==k?(so.dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr>${r.map(o=>`<tr><td>${esc(o.d.company)}</td><td>${esc(o.d.role)}</td><td><b>${esc(o.s.name)}</b><br><span class="m">${esc(o.s.enr)}</span></td><td>${o.s.br} / ${o.s.sem}</td><td>${o.s.cgpa??'—'}</td><td>${o.s.att}%</td><td>${o.s.back}</td><td>${esc(relSk(o.d,o.s))}</td><td>${vc(o.s)}</td><td>${internTxt(o.s)}</td><td>${EB(o.x.status)}<br><a href="#" onclick="expl('${o.d.id}','${o.s.id}');return false" style="font-size:12px">Why?</a></td><td>${o.x.status=='Eligible'?`<select onchange="setStage('${o.d.id}','${o.s.id}',this.value)"><option value="">Not reviewed</option>${STG.map(g=>`<option ${o.stage==g?'selected':''}>${g}</option>`).join('')}</select>`:'<span class="m">—</span>'}</td><td>${o.ap?'Yes':'—'}</td><td><button class="btn o s" onclick="go('pcp','${o.s.id}')">Profile</button> <button class="btn o s" onclick="go('pcp','${o.s.id}')">Review docs</button> <button class="btn s" ${o.x.status=='Eligible'?'':'disabled title="Only eligible students can be shortlisted"'} onclick="setStage('${o.d.id}','${o.s.id}','Shortlisted')">Shortlist</button></td></tr>`).join('')||`<tr><td colspan="14" class="m">No matching students. Generate a list for a drive or relax the filters.</td></tr>`}</table></div>`}
const refEl=()=>{const e=$('eltb');if(e)e.innerHTML=elTable()};
const ef=(k,v)=>{PL.f[k]=v;refEl()};
const srt=k=>{PL.sort=PL.sort.k==k?{k,dir:-PL.sort.dir}:{k,dir:1};refEl()};
function setStage(did,sid,v){const d=DR.find(x=>x.id==did);if(d.results[sid].status!='Eligible')return toast('Only students with Eligible status can be moved forward');if(v)d.stage[sid]=v;else delete d.stage[sid];toast(v?`Stage set to ${v}`:'Stage cleared');if($('eltb'))refEl();else draw()}
const hd=['Company','Role','Student','Enrollment','Branch','Semester','CGPA','Attendance %','Active backlogs','Skills','Verified certificates','Internship (verified months)','Eligibility','Faculty stage'];
const csvRow=o=>[o.d.company,o.d.role,o.s.name,o.s.enr,o.s.br,o.s.sem,o.s.cgpa??'',o.s.att,o.s.back,o.s.skills.join('; '),vc(o.s),vm(o.s),o.x.status,o.stage||'Not reviewed'];
function csv(rows,name){const t=[hd,...rows.map(csvRow)].map(a=>a.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast(`Exported ${rows.length} row(s) to ${name}`)}
const shortRows=did=>{const r=[];DR.filter(d=>!did||d.id==did).forEach(d=>{if(!d.results)return;PS.forEach(s=>{if(ADV.includes(d.stage[s.id]))r.push({d,s,x:d.results[s.id],stage:d.stage[s.id]})})});return r};
function reportM(rows,title){showM(`<div class="np" style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="printM()">Print / Save as PDF</button><button class="btn o" onclick="closeM()">Close</button></div><h2>EduTrack AI — ${esc(title)}</h2><p class="m">Generated ${new Date().toLocaleString()} · Prototype with fictional data</p><div class="tw"><table class="tbl"><tr>${['Company','Student','Enrollment','Branch/Sem','CGPA','Attendance','Backlogs','Verified certs','Eligibility','Stage'].map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(o=>`<tr><td>${esc(o.d.company)}</td><td>${esc(o.s.name)}</td><td>${esc(o.s.enr)}</td><td>${o.s.br}/${o.s.sem}</td><td>${o.s.cgpa??'—'}</td><td>${o.s.att}%</td><td>${o.s.back}</td><td>${vc(o.s)}</td><td>${o.x.status}</td><td>${o.stage||'Not reviewed'}</td></tr>`).join('')||'<tr><td colspan="10">No records</td></tr>'}</table></div>`)}
function shareM(did){const d=DR.find(x=>x.id==did),rows=shortRows(did);showM(`<h3>Review before sharing — ${esc(d.company)}</h3><p class="m">Only faculty-reviewed shortlisted candidates are included. Documents are shared only if they are <b>Verified</b> and the student allows sharing.</p>${rows.length?tbl(['Student','CGPA','Stage','Documents'],rows.map(o=>`<tr><td>${esc(o.s.name)}</td><td>${o.s.cgpa??'—'}</td><td>${o.stage}</td><td>${o.s.share?`${vc(o.s)} verified document(s) included`:'Withheld — student has not allowed sharing'}</td></tr>`)):'<p>No shortlisted candidates yet.</p>'}<br><button class="btn" ${rows.length?'':'disabled'} onclick="DR.find(x=>x.id=='${did}').shared=true;closeM();toast('Marked as shared (simulated — nothing was sent)');draw()">Confirm share with company</button> <button class="btn o" onclick="closeM()">Cancel</button>`)}
P.faculty.pel=()=>{const f=PL.f,sel=(k,o)=>`<select onchange="ef('${k}',this.value)">${o.map(([v,l])=>`<option value="${v}" ${f[k]==v?'selected':''}>${l}</option>`).join('')}</select>`;
return `<h2>Eligible Students</h2>${plNote}<div class="card"><div class="fg"><label>Search<input value="${esc(f.q)}" oninput="ef('q',this.value)" placeholder="Name, enrollment, company…"></label><label>Company${sel('drive',[['','All'],...DR.map(d=>[d.id,d.company])])}</label><label>Job role<input value="${esc(f.role)}" oninput="ef('role',this.value)"></label><label>Branch${sel('br',[['','All'],...BRS.map(b=>[b,b])])}</label><label>Min CGPA<input type="number" step="0.1" value="${esc(f.cgpa)}" oninput="ef('cgpa',this.value)"></label><label>Min attendance %<input type="number" value="${esc(f.att)}" oninput="ef('att',this.value)"></label><label>Skill<input value="${esc(f.skill)}" oninput="ef('skill',this.value)"></label><label>Verified internship${sel('intern',[['','Any'],['yes','Has'],['no','None']])}</label><label>Eligibility${sel('status',[['','All'],['Eligible','Eligible'],['Needs Review','Needs Review'],['Not Eligible','Not Eligible']])}</label></div><br><button class="btn" onclick="csv(elRows(),'eligible-students.csv')">Export list to CSV</button> <button class="btn o" onclick="reportM(elRows(),'Eligible Students Report')">Generate printable PDF report</button> <button class="btn o" onclick="csv(shortRows(PL.f.drive),'reviewed-shortlist.csv')">Export reviewed shortlist</button> <button class="btn o" onclick="PL.f.drive?shareM(PL.f.drive):toast('Select a company filter first')">Share list with company…</button></div><div class="card" id="eltb">${elTable()}</div><p class="m">Eligibility (system result) is kept separate from the faculty stage (review / selection).</p>`};

/* ---------- profiles, queue, reports ---------- */
P.faculty.pcp=()=>{if(S.sel){const s=PS.find(x=>x.id==S.sel);return `<button class="btn o s" onclick="go('pcp')">← All profiles</button><br><br><h2>Student Career Profile</h2><div class="note">Visible to authorised faculty only. Student sharing preference: <b>${s.share?'Verified documents may be shared with recruiters':'Documents must NOT be shared with recruiters'}</b>.</div>${card('Eligibility by drive',tbl(['Company','Role','Status','Stage',''],DR.filter(d=>d.results).map(d=>`<tr><td>${esc(d.company)}</td><td>${esc(d.role)}</td><td>${EB(d.results[s.id].status)}</td><td>${d.stage[s.id]||'—'}</td><td><button class="btn o s" onclick="expl('${d.id}','${s.id}')">Explanation</button></td></tr>`)))}${pfView(s,1)}`}
const q=PL.pq.toLowerCase();return `<h2>Student Career Profiles</h2>${plNote}<input placeholder="Search students…" value="${esc(PL.pq)}" oninput="PL.pq=this.value;$('pcl').innerHTML=pcList()" style="width:100%;max-width:360px"><br><br><div id="pcl">${pcList()}</div>`};
const pcList=()=>{const q=PL.pq.toLowerCase();return `<div class="grid">${PS.filter(s=>(s.name+s.enr+s.br).toLowerCase().includes(q)).map(s=>{const p=[...s.certs,...s.interns.filter(i=>i.doc)].filter(i=>i.status=='Pending').length;return `<div class="card" style="cursor:pointer" onclick="go('pcp','${s.id}')"><b>${esc(s.name)}</b><br><span class="m">${esc(s.enr)} · ${s.br} · Sem ${s.sem}</span><p>CGPA ${s.cgpa??'—'} · ${vc(s)} verified cert(s) · ${p} pending</p><span class="bd ${s.share?'V':'U'}">${s.share?'Sharing allowed':'Sharing not allowed'}</span></div>`}).join('')}</div>`};
P.faculty.pvq=()=>{const all=pendDocs(),rows=all.filter(x=>!PL.vq||x.it.status==PL.vq);
return `<h2>Verification Queue</h2>${plNote}<div class="steps">${['Pending','Verified','Rejected',''].map(k=>`<span class="${PL.vq==k?'on':''}" style="cursor:pointer" onclick="PL.vq='${k}';draw()">${k||'All'} (${k?all.filter(x=>x.it.status==k).length:all.length})</span>`).join('')}</div>${card('Documents',rows.length?tbl(['Student','Type','Document','File','Status','Remark','Action'],rows.map(({s,t,i,it})=>`<tr><td>${esc(s.name)}</td><td>${t=='certs'?'Certificate':'Internship certificate'}</td><td>${esc(t=='certs'?it.name+' · '+it.org:it.company+' · '+it.role)}</td><td><button class="btn o s" onclick="pvDoc('${s.id}','${t}',${i})">Preview</button></td><td>${BD(it.status)}</td><td><input id="rm_${s.id}${t}${i}" value="${esc(it.remark)}" placeholder="Remark" style="width:150px"></td><td>${it.status!='Verified'?`<button class="btn s" onclick="setVer('${s.id}','${t}',${i},'Verified')">Verify</button> `:''}${it.status!='Rejected'?`<button class="btn o s" onclick="setVer('${s.id}','${t}',${i},'Rejected')">Reject</button>`:''}</td></tr>`)):'<p class="m">Nothing in this view.</p>')}<p class="m">Verification here is a manual faculty judgement in this prototype; no automated authenticity check is performed.</p>`};
P.faculty.prep=()=>`<h2>Placement Reports</h2>${plNote}${DR.map(d=>{const c=k=>PS.filter(s=>d.results&&d.results[s.id].status==k).length,n=PS.length;const byB=BRS.map(b=>[b,PS.filter(s=>s.br==b&&d.results&&d.results[s.id].status=='Eligible').length]);
return card(`${esc(d.company)} — ${esc(d.role)}`,`${staleBanner(d)}<div class="grid"><div><b>Eligibility outcome</b>${bars([['Eligible',Math.round(c('Eligible')/n*100)],['Needs Review',Math.round(c('Needs Review')/n*100)],['Not Eligible',Math.round(c('Not Eligible')/n*100)]])}</div><div><b>Faculty stages</b>${STG.map(g=>`<p>${g}: <b>${Object.values(d.stage).filter(x=>x==g).length}</b></p>`).join('')}<p>Applied: <b>${Object.keys(d.applied).length}</b> · Shared with company: <b>${d.shared?'Yes':'No'}</b></p></div><div><b>Eligible by branch</b>${byB.map(([b,v])=>`<p>${b}: <b>${v}</b></p>`).join('')}</div></div><br><button class="btn" onclick="csv(shortRows('${d.id}'),'${d.company.split(' ')[0].toLowerCase()}-shortlist.csv')">Export reviewed shortlist (CSV)</button> <button class="btn o" onclick="reportM(shortRows('${d.id}'),'Reviewed Shortlist — ${esc(d.company)}')">Printable PDF report</button> <button class="btn o" onclick="shareM('${d.id}')">Share with company…</button>`)}).join('')}`;

/* ---------- navigation wiring ---------- */
NAVS.student.splice(NAVS.student.findIndex(x=>x[0]=='prof'),0,['_p','Placement'],['pf','My Career Portfolio'],['pd','Placement Dashboard'],['pr','Placement Readiness']);
NAVS.faculty.splice(NAVS.faculty.findIndex(x=>x[0]=='prof'),0,['_p','Placement'],['pdash','Placement Dashboard'],['pdr','Company Drives'],['pnew','Create Recruitment Drive'],['pgen','Eligibility Generator'],['pel','Eligible Students'],['pcp','Student Career Profiles'],['pvq','Verification Queue'],['prep','Placement Reports']);

draw();
</script></body></html>
